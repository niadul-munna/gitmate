name: Release build

# Builds release artifacts for a version tag and uploads them to the workflow
# run. Publishing a GitHub release is a manual step (see docs/releasing.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: cargo test
      - run: cargo build --release -p gitmate-cli
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - run: pnpm tauri build --bundles deb,appimage
        working-directory: apps/desktop
      - name: Collect artifacts and checksums
        run: |
          mkdir dist
          cp target/release/gitmate "dist/gitmate-linux-x86_64"
          cp target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage dist/
          cd dist && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: gitmate-linux-x86_64
          path: dist/
