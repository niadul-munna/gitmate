name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could GitMate help? Mention which Git settings or files would be involved.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
